alias: Thermostat Actionable Notification Handler
description: >-
 Listens for notification buttons, clears the alert, sets mode, and applies
 occupied setpoints.
triggers:
  - trigger: event
    event_type: mobile_app_notification_action
    event_data:
      action: SET_HEAT
  - trigger: event
    event_type: mobile_app_notification_action
    event_data:
      action: SET_COOL
conditions: []
actions:
  - action: notify.mobile_app_your_phone
    metadata: {}
    data:
      message: clear_notification
      tag: climate-alert
  - if:
      - condition: template
        value_template: "{{ trigger.event.data.action == 'SET_HEAT' }}"
    then:
      - action: climate.set_hvac_mode
        metadata: {}
        target:
          entity_id: climate.climate_group
        data:
          hvac_mode: heat
      - action: climate.set_temperature
        metadata: {}
        target:
          entity_id: climate.climate_group
        data:
          target_temp_low: 74
          target_temp_high: 80
    else:
      - if:
          - condition: state
            entity_id: climate.climate_group
            state: cool
        then:
          - action: climate.set_temperature
            metadata: {}
            target:
              entity_id: climate.climate_group
            data:
              target_temp_low: 68
              target_temp_high: 74
          - action: notify.mobile_app_your_phone
            metadata: {}
            data:
              title: Home Occupied
              message: >-
                Climate is COOLING set to 68/74. Current room temp: {{
                state_attr('climate.climate_group', 'current_temperature') }}°F
        else:
          - action: climate.set_temperature
            metadata: {}
            target:
              entity_id: climate.climate_group
            data:
              target_temp_low: 68
              target_temp_high: 80
            - action: notify.mobile_app_your_phone
              metadata: {}
              data:
                title: WARNING
                message: >-
                  Climate is OUT OF BOUNDS ({{ states('climate.climate_group')
                  }}). Room temp: {{ state_attr('climate.climate_group',
                  'current_temperature') }}°F
                  tag: climate-alert
                  actions:
                    - action: SET_HEAT
                      title: Switch to Heat
                    - action: SET_COOL
                      title: Switch to Cool
mode: queued